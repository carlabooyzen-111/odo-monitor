name: monitor
on:
  schedule:
    - cron: "*/10 * * * *"   # backup starter; the run also restarts itself
  workflow_dispatch:
    inputs:
      mode:
        description: "run | discover | test-notify | dry-run"
        default: "run"
permissions:
  contents: write
  actions: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          git config user.name monitor
          git config user.email monitor@users.noreply.github.com
          pip install -q pillow numpy
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            discover) python3 monitor.py --discover ;;
            test-notify) python3 monitor.py --test-notify ;;
            dry-run) python3 monitor.py --dry-run ;;
            *) python3 monitor.py --loop 3000 ;;
          esac
      - name: Save state
        if: always()
        run: |
          [ -f monitor.db ] && git add monitor.db
          git diff --cached --quiet || (git commit -qm "state" && git pull --rebase -q && git push -q)
      - name: Start next run (continuous monitoring)
        if: always() && (inputs.mode == '' || inputs.mode == 'run')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml -f mode=run
