name: monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | discover | test-notify | dry-run"
        default: "run"
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install image libs
        run: pip install -q pillow numpy
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            discover) python3 monitor.py --discover ;;
            test-notify) python3 monitor.py --test-notify ;;
            dry-run) python3 monitor.py --dry-run ;;
            *) python3 monitor.py --loop 240 ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name monitor
          git config user.email monitor@users.noreply.github.com
          [ -f monitor.db ] && git add monitor.db
          git diff --cached --quiet || (git commit -qm "state" && git pull --rebase -q && git push -q)
